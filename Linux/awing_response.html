<script>
    document.addEventListener("DOMContentLoaded", function () {
        let scrollElement = document.getElementById('awing-captive__continue-scroll');
        // Tạo một Intersection Observer
        let observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    // Phần tử bắt đầu xuất hiện trong viewport
                    console.log('Continue hide!');
                    scrollElement.style.display = 'none';
                } else {
                    // Phần tử đã biến mất khỏi viewport
                    console.log('Continue show!');
                    scrollElement.style.display = 'block';
                }
            });
        });

        // Chọn phần tử cần theo dõi
        let targetElement = document.getElementById('awing-section-to-observe');

        // Bắt đầu quan sát
        observer.observe(targetElement);
    });
</script>    </main>
