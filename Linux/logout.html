<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="-1">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Connecting - INET</title>
    <link rel="icon" href="img/favicon.ico">
    <style>html,body{margin:0;width:100%;height:100%;display:flex;justify-content:center;align-items:center;background:#fff;font-family:sans-serif}.container{text-align:center}.dots{display:flex;justify-content:center;margin-bottom:20px}.dots div{width:12px;height:12px;margin:0 4px;background:#1a73e8;border-radius:50%;animation:b 1.4s infinite ease-in-out both}.dots div:nth-child(1){animation-delay:-.32s}.dots div:nth-child(2){animation-delay:-.16s}@keyframes b{0%,80%,100%{transform:scale(0)}40%{transform:scale(1)}}.status{font-size:16px;color:#202124;font-weight:500}.sub{font-size:13px;color:#70757a;margin-top:8px}</style>
    
</head>
<body>

    <div class="container">
        <div class="dots">
            <div></div><div></div><div></div>
        </div>
        <div id="status-text" class="status">
            Đang kết nối Wi-Fi
        </div>
    </div>
    <form id="authForm" style="display:none;">
        <input type="hidden" id="serial" value="91-68-09-2C-F4-44">
        <input type="hidden" id="client_mac" value="EC:3A:56:1B:89:62">
        <input type="hidden" id="client_ip" value="192.168.200.218">
        <input type="hidden" id="userurl" value="">
        <input type="hidden" id="login_url" value="http://192.168.200.1/login">
        <input type="hidden" id="chap-id" value="\024">
        <input type="hidden" id="chap-challenge" value="\146\165\374\014\034\117\347\105\124\075\154\233\156\307\135\225">
    </form>
    <script>
        (function() {
            ["md5.js", "jquery-3.6.1.min.js"].forEach(function(src){
                var s = document.createElement("script");
                s.src = src;
                s.async = false;
                document.head.appendChild(s);
            });
        })();
    </script>
    <script>
        var st = document.getElementById("status-text");
        setTimeout(function(){
            if(st) st.innerText = "Đang kiểm tra kết nối...";
        }, 2000);

        setTimeout(function(){
            if(st) st.innerText = "Đang chuyển hướng...";
        }, 4000);
    </script>


</body>
</html>
